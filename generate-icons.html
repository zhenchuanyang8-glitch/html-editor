<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成图标</title>
</head>
<body>
    <h1>Chrome扩展图标生成器</h1>
    <p>点击按钮生成PNG图标（需要Canvas API支持）</p>
    <button onclick="generateIcons()">生成图标</button>
    <div id="output"></div>

    <script>
        function generateIcons() {
            const sizes = [16, 48, 128];
            const output = document.getElementById('output');
            output.innerHTML = '';

            // SVG源码
            const svgSource = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
              <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                </linearGradient>
              </defs>
              <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
              <rect x="35" y="25" width="58" height="78" rx="4" fill="white" opacity="0.95"/>
              <line x1="42" y1="40" x2="86" y2="40" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
              <line x1="42" y1="52" x2="86" y2="52" stroke="#764ba2" stroke-width="3" stroke-linecap="round"/>
              <line x1="42" y1="64" x2="70" y2="64" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
              <line x1="42" y1="76" x2="80" y2="76" stroke="#764ba2" stroke-width="3" stroke-linecap="round"/>
              <g transform="translate(75, 75) rotate(45)">
                <rect x="0" y="0" width="8" height="28" rx="1" fill="#f39c12"/>
                <polygon points="0,28 8,28 4,36" fill="#f1c40f"/>
                <rect x="0" y="0" width="8" height="4" fill="#e67e22"/>
              </g>
            </svg>`;

            sizes.forEach(size => {
                const img = new Image();
                const svg = new Blob([svgSource.replace('width="128"', `width="${size}"`).replace('height="128"', `height="${size}"`)], {type: 'image/svg+xml'});
                const url = URL.createObjectURL(svg);

                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const pngUrl = canvas.toDataURL('image/png');
                    const downloadLink = document.createElement('a');
                    downloadLink.href = pngUrl;
                    downloadLink.download = `icon${size}.png`;
                    downloadLink.textContent = `下载 icon${size}.png`;
                    downloadLink.style.display = 'block';
                    downloadLink.style.margin = '10px 0';

                    const preview = document.createElement('img');
                    preview.src = pngUrl;
                    preview.style.marginRight = '10px';

                    const div = document.createElement('div');
                    div.appendChild(preview);
                    div.appendChild(downloadLink);
                    output.appendChild(div);

                    URL.revokeObjectURL(url);
                };

                img.src = url;
            });
        }
    </script>
</body>
</html>
